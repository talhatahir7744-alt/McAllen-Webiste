<style>
/* Reviews widget wrapper: the LeadConnector iframe starts at 1px and only grows once its reviews have loaded
   (often 5–8 s), so space is reserved and a quiet placeholder is shown until the height message arrives
   (public/ghl-offline-shim.js sizes the iframe, adds .snz-reviews--loaded and ignores the widget's periodic 1px
   collapse messages; the vendor helper review-widget.js is deliberately not embedded, it would re-apply them). */
/* the wrapper is sized by the shim to the widget's reported height and clips anything beyond it, so a browser
   that lays the iframe out taller than reported (iOS Safari) cannot leave blank space under the reviews */
.snz-reviews { position: relative; min-height: 380px; overflow: hidden; transition: height 0.3s ease; }
.snz-reviews .lc_reviews_widget { position: relative; z-index: 1; display: block; min-width: 100%; width: 100%; border: 0; }
.snz-reviews__loading {
  position: absolute; inset: 0; z-index: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  border-radius: 18px; background: rgba(255, 255, 255, 0.55); border: 1px dashed rgba(0, 20, 137, 0.15);
  color: #5b6690; font: 500 14px/1.4 'Poppins', 'Montserrat', Arial, sans-serif; text-align: center;
  transition: opacity 0.4s ease, visibility 0s linear 0.4s;
}
.snz-reviews__loading::before {
  content: ''; width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid rgba(245, 132, 51, 0.25); border-top-color: #f58433;
  animation: snzReviewsSpin 0.9s linear infinite;
}
.snz-reviews--loaded { min-height: 0; }
.snz-reviews--loaded .snz-reviews__loading { opacity: 0; visibility: hidden; }
@keyframes snzReviewsSpin { to { transform: rotate(360deg); } }
@media (max-width: 767px) { .snz-reviews:not(.snz-reviews--loaded) { min-height: 560px; } }
@media (prefers-reduced-motion: reduce) { .snz-reviews__loading::before { animation: none; } }
</style>
<div class='snz-reviews'>
  <div class='snz-reviews__loading' aria-live='polite'>Loading customer reviews…</div>
  <iframe class='lc_reviews_widget' title='Customer reviews for Snooze Mattress Brownsville' src='https://reputationhub.site/reputation/widgets/review_widget/{{locationId}}?widgetId={{widgetId}}' frameborder='0' scrolling='no' style='min-width: 100%; width: 100%;'></iframe>
</div>
